[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vakra-rl"
version = "0.1.0"
description = "Execution-verified tool-use agents for IBM's VAKRA benchmark: baselines, SFT and GRPO for small models"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools]
packages = ["vakra_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
